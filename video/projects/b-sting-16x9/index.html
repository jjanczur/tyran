<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tyran — logo sting · cinematic (16:9)</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #12100e; }

      :root {
        --stone: #12100e;
        --heading: #f5efe3; --muted: #a29788;
        --gold: #d4a017; --gold-bright: #e8bc4d;
        --display: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      #ground { position: absolute; inset: 0; background: var(--stone); }
      .clip { position: absolute; inset: 0; }

      .plate { position: absolute; inset: 0; overflow: hidden; }
      /* The conductor's head sits high and right in this plate. A centred
         124% box plus a centred zoom cropped it straight out of frame.
         Two changes keep it: the box is barely larger than the frame, and the
         transform-origin is ON the head — so the push moves TOWARD the
         conductor and that point never moves, instead of expanding past it. */
      /* Plate framing.
         percentage margin-top resolves against the container's WIDTH, not its
         height, so the old `left:50%; margin-left:-62%; margin-top:-62%` pushed
         the image up by 62% of 1920 instead of 62% of 1080 — which cropped the
         conductor's head off the top and left a black band at the bottom.
         left/top percentages resolve against width/height respectively, so
         insetting by half the overflow centres correctly with no margins. */
      .plate img {
        position: absolute; left: -2%; top: -2%;
        width: 104%; height: 104%; object-fit: cover;
        transform-origin: 50% 50%;
      }
      /* The conductor plate keeps its right third; the lockup takes the left,
         which is the negative space the plate was generated to leave. */
      #scrim {
        position: absolute; inset: 0;
        background: linear-gradient(90deg, rgba(10,9,8,.95) 0%, rgba(10,9,8,.82) 32%,
          rgba(10,9,8,.34) 62%, rgba(10,9,8,.06) 100%);
      }
      #grain {
        position: absolute; inset: 0; opacity: .055;
        background-image: radial-gradient(rgba(245,239,227,.9) .5px, transparent .6px);
        background-size: 3px 3px;
      }

      .lockup { position: absolute; left: 140px; top: 316px; width: 780px; }
      #mark { display: block; width: 172px; height: 172px; color: var(--gold);
        filter: drop-shadow(0 0 40px rgba(212,160,23,.44)); }
      .wordmark {
        display: block; margin-top: 28px; font: 400 118px/1 var(--display);
        letter-spacing: .2em; text-indent: .2em; color: var(--heading);
        text-shadow: 0 6px 44px rgba(0,0,0,.92);
      }
      #rule {
        display: block; width: 620px; height: 2px; margin-top: 30px; transform-origin: 0 50%;
        background: linear-gradient(90deg, rgba(232,188,77,1) 0%, rgba(212,160,23,0) 100%);
      }
      .tagline { display: block; margin-top: 26px; font: 400 33px var(--font); color: var(--muted); }
      .tagline em { color: var(--gold-bright); font-style: italic; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1920"
      data-height="1080"
    >
      <div id="bg" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="ground"></div>
      </div>

      <div id="plate-layer" class="clip" data-start="0" data-duration="6" data-track-index="1">
        <div class="plate"><img id="p1" src="assets/conductor-16x9.png" alt="" /></div>
        <div id="scrim"></div>
      </div>

      <div id="lock-layer" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <div class="lockup">
          <svg id="mark" viewBox="0 0 64 64" aria-hidden="true">
            <path d="M17 8 L24 27 L28 25 L36 6 L42 27 L47 31 L58 38 L46 43 L36 49 L25 45 L19 34 Z" fill="currentColor" />
            <circle cx="33" cy="33" r="2.6" fill="#12100e" />
            <path id="mark-lash" d="M13 57 C 21 51, 27 60, 36 54 S 48 47, 55 51" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" fill="none" />
          </svg>
          <span class="wordmark">TYRAN</span>
          <span id="rule"></span>
          <span class="tagline">the more you use it, <em>the better it gets</em></span>
        </div>
      </div>

      <div id="grain-layer" class="clip" data-start="0" data-duration="6" data-track-index="3">
        <div id="grain"></div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const markLash = document.getElementById("mark-lash");
      const markLashLen = markLash.getTotalLength();
      markLash.setAttribute("stroke-dasharray", markLashLen);
      markLash.setAttribute("stroke-dashoffset", markLashLen);

      /* one slow push, the whole six seconds — the plate never sits still */
      tl.fromTo("#p1", { scale: 1.0 }, { scale: 1.06, duration: 6, ease: "sine.inOut" }, 0);
      tl.fromTo("#scrim", { autoAlpha: .82 }, { autoAlpha: 1, duration: 1.4, ease: "power2.out" }, 0);

      tl.fromTo("#mark", { autoAlpha: 0, scale: .68, y: 30 },
        { autoAlpha: 1, scale: 1, y: 0, duration: .84, ease: "back.out(1.9)" }, .5);
      tl.fromTo("#mark-lash", { strokeDashoffset: markLashLen },
        { strokeDashoffset: 0, duration: .55, ease: "power2.out" }, 1.05);
      tl.fromTo(".wordmark", { autoAlpha: 0, y: 34 }, { autoAlpha: 1, y: 0, duration: .72, ease: "power3.out" }, 1.15);
      tl.fromTo("#rule", { scaleX: 0, autoAlpha: 0 }, { scaleX: 1, autoAlpha: 1, duration: .8, ease: "power3.out" }, 1.65);
      tl.fromTo(".tagline", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: .66, ease: "power2.out" }, 1.9);

      const holdAt = 2.9, holdFor = 6 - holdAt, cyc = 2.6;
      tl.to(".lockup", {
        scale: 1.013, duration: cyc / 2, ease: "sine.inOut",
        yoyo: true, repeat: Math.max(0, Math.floor(holdFor / cyc) * 2 - 1),
      }, holdAt);
      tl.to("#mark", { y: -6, duration: holdFor, ease: "sine.inOut" }, holdAt);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
