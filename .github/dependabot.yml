version: 2

# Two ecosystems, and only two, because only two exist here.
#
# The plugin itself has ZERO runtime dependencies — that is a property the
# README claims and a CI check enforces, so there is nothing for Dependabot to
# bump in the root `package.json` and no entry for it below. What does have
# dependencies is the documentation site (Astro, Starlight, the Mermaid
# renderer) and the pinned action SHAs in the workflows. Both are build-time
# surfaces, and both are exactly where an unattended project rots.
updates:
  # A week between a version being published and Dependabot proposing it.
  #
  # The npm supply chain's worst days all look the same: a maintainer account
  # is taken over, a malicious patch release goes out, and the automation that
  # exists to keep projects current is what installs it — within the hour,
  # everywhere, before anyone has looked. Seven days is long enough that
  # somebody else finds it first, and short enough that this repo is never
  # meaningfully behind on a build-time dependency.
  #
  # This block is here because the repo's own semgrep gate refused the PR that
  # added the file without it. Worth recording: the gate was right, and it was
  # cheaper to be told by CI than by an incident.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # Every action in this repo is pinned to a commit SHA with a version
    # comment. Dependabot understands that form and updates both halves; a
    # human re-pinning by hand updates the comment and forgets the SHA.
    commit-message:
      prefix: 'chore(actions)'

  - package-ecosystem: npm
    directory: '/site'
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'chore(site)'
    ignore:
      # TypeScript majors are held back by `@astrojs/check`, whose newest
      # release (0.9.10) still declares `typescript: ^5.0.0 || ^6.0.0`. The
      # Pages workflow runs `npm run check` — which is `astro check`, which is
      # that package — so accepting TS 7 here breaks the deploy, not a test.
      # Drop this entry the day @astrojs/check widens its peer range.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      # One PR for the doc-site toolchain instead of five. These move together
      # and are validated by one command (`npm run build`), so splitting them
      # buys nothing but five review cycles.
      astro:
        patterns:
          - 'astro'
          - '@astrojs/*'
          - 'sharp'
      # Everything else in one PR, for the same reason and a sharper one: the
      # rest of this tree is transitive, so its bumps are lockfile-only lines
      # nobody can review individually anyway. Four such PRs sat open for ten
      # days in August 2026 — not because any of them was contentious, but
      # because four is a queue and one is a chore.
      site-rest:
        patterns:
          - '*'
      # Security fixes arrive on their own track (no cooldown, ungrouped by
      # default), and that is where the four came from. Group them too: the
      # advisories that land together are usually one upstream release.
      site-security:
        applies-to: security-updates
        patterns:
          - '*'
