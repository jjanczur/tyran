name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install gitleaks (the secrets gate's scanner)
        # Pinned by version AND by checksum. Without it the secrets gate's
        # end-to-end test SKIPS, and a skipped test on the one control whose
        # failure is irreversible is indistinguishable from a passing one.
        # A skip that only happens on CI is the worst kind: it is invisible
        # exactly where the merge decision is made.
        run: |
          set -euo pipefail
          version=8.30.1
          sha=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSL --retry 3 -o /tmp/gitleaks.tar.gz "$url"
          echo "${sha}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
      - name: No test may be silently skipped
        # `node --test` reports a skip as a pass. The secrets gate's real-binary
        # test skips itself when gitleaks is absent, which is right locally and
        # wrong here, so CI asserts the count is zero rather than trusting the
        # green tick above it.
        run: |
          set -euo pipefail
          node --test "tests/**/*.test.mjs" > /tmp/test-output.txt 2>&1 || true
          grep -E '^# skipped 0$' /tmp/test-output.txt || {
            echo "A test was skipped on CI. Skips are invisible in a green run:"
            grep -E '^# skipped|SKIP' /tmp/test-output.txt || true
            exit 1
          }
      - name: The README's test count is the real one
        # `tests/unit/docs-claims.test.mjs` verifies every "N unit tests" claim
        # on the docs surfaces, because each of those is about ONE test file and
        # can be counted by running it. The README's number is about the WHOLE
        # suite, so no unit test can check it without running the suite from
        # inside the suite. It went stale by 91 tests before anyone noticed.
        #
        # The measurement already exists: the step above wrote a full run to
        # /tmp/test-output.txt. Comparing against it costs nothing.
        run: |
          set -euo pipefail
          # Reporter-agnostic on purpose: node prints "# tests N" under tap and
          # "<glyph> tests N" under spec, and which one you get depends on
          # whether stdout is a terminal. Match the tail of the summary line so
          # this reads the same locally as it does here.
          actual=$(grep -oE 'tests [0-9]+$' /tmp/test-output.txt | tail -1 | awk '{print $2}')
          claimed=$(grep -oE '[0-9]+ unit tests' README.md | awk '{print $1}')
          test -n "$actual" || { echo "no test count in the run output"; exit 1; }
          test -n "$claimed" || { echo "README no longer claims a test count"; exit 1; }
          test "$actual" = "$claimed" || {
            echo "README claims $claimed unit tests; the suite has $actual."
            exit 1
          }
          echo "README: $claimed unit tests, and so does the suite."
      - name: Validate shipped templates against their schemas
        run: |
          node scripts/schema.mjs validate config templates/config.yaml
          node scripts/schema.mjs validate knowledge templates/knowledge.yaml
          node scripts/schema.mjs validate policy templates/policies/autonomy.yaml
      - name: Skill description budget
        # No `--budget` here on purpose. The number lives in exactly one place,
        # `DEFAULT_BUDGET` in the script, and a test pins it. When it was typed
        # here as well, the two could disagree — and the disagreement surfaces
        # as a CI failure quoting a ceiling that no longer exists in the repo.
        run: node scripts/desc-budget.mjs .
      - name: No raw control or bidi characters in tracked files (ADR-19)
        # Editing tools turn the TEXT of an escape into the character itself;
        # it happened seven times in one session here. The damage is silent —
        # a NUL made grep return zero matches with exit 0, and an unterminated
        # bidi override mirrored a generated table row. The scanner lives in
        # scripts/ rather than inline in this YAML so it can be unit-tested.
        run: node scripts/scan-control-chars.mjs .

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate plugin manifest
        # `validate .` only checks marketplace.json when both manifests exist —
        # the plugin manifest must be validated explicitly (review finding E1-R2).
        run: claude plugin validate .claude-plugin/plugin.json

