name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test "tests/**/*.test.mjs"
      - name: Skill description budget
        run: node scripts/desc-budget.mjs --budget 4000 .

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace manifest
        run: claude plugin validate .
      - name: Validate plugin manifest
        # `validate .` only checks marketplace.json when both manifests exist —
        # the plugin manifest must be validated explicitly (review finding E1-R2).
        run: claude plugin validate .claude-plugin/plugin.json

