# Tyran configuration for this repository.
#
# Written by /tyran:setup, edited freely by you. Inferred fields carry
# provenance so you can audit where a value came from:
#
#   autonomy:
#     value: P1
#     source: 'git log: last 50 merges are PRs, main is protected'
#     confidence: 0.9
#     needs_confirmation: false
#
# Validate after editing:  node scripts/schema.mjs validate config .tyran/config.yaml

# Cost mode: eco | balanced | full  (see https://jjanczur.github.io/tyran/configuration/)
profile: balanced

# Deployment autonomy: P1 branch-only · P2 staging · P3 merge to main.
# The gate enforces this downward; it does not stop an agent that can edit
# this file from raising it. When in doubt, setup picks P1.
autonomy: P1

# The ONLY place model names appear. Every other file — skills, agents,
# policies — is written in ROLE names, so a model deprecation is a one-line
# change here and nothing else moves.
#
# Resolve a role to a model:  node scripts/tiers.mjs --role reviewer
#
# The default deliberately puts the everyday work on `work`. A strong model
# on a mechanical sweep buys nothing and spends the budget that the two calls
# below actually need.
tiers:
  cheap: haiku # scout, mechanical sweeps, ledger bookkeeping
  work: sonnet # DEFAULT: implementation and ordinary review
  deep: opus # root-cause diagnosis, hard implementation, risky review
  top: fable # security review, arbitration, final acceptance

# Repo validation commands, run before anything is called done.
validation:
  - npm run lint
  - npm run typecheck
  - npm test

# Files multiple agents may touch: append-only, serialized by the conductor.
shared_zones: []

# Overnight mode — pause autonomous work near the subscription usage limits
# and resume after the window resets (https://jjanczur.github.io/tyran/overnight/). Requires the
# operator-installed statusline helper (scripts/statusline.mjs), which is the
# only place the platform exposes usage telemetry; without it the gate is
# silent and doctor says so.
#
#   mode: off | warn | pause     warn surfaces, never denies; pause winds down
#   wait_max_hours: 5            reset further away than this = a LONG pause:
#                                notify and hold rather than silently waiting
#                                days (the weekly window). Within it: schedule
#                                the resume and say when.
#   long_wait: hold | resume     what the scheduler does beyond wait_max_hours
#   keep_awake: false            true holds the SYSTEM awake while the resume
#                                watcher waits — a laptop that suspends takes
#                                the watcher with it. Never the display: your
#                                screen lock is untouched.
limits:
  mode: 'off' # quoted — bare off is YAML for false
  pause_at_percent: 97
  weekly_pause_at_percent: 97
  wait_max_hours: 5
  long_wait: hold
  resume_margin_minutes: 5
  keep_awake: false # a real boolean, so the bare-off trap above cannot apply

# The dashboard. Unlike everything above, this defaults ON: the board is where
# a journal, a projection and a spend report become something a person can
# read, and an install where nobody starts it is an install where none of that
# is ever seen. Set autostart: false to turn it down.
#
#   autostart: true   start it with the session, if it is not already up
#   port: 4173        the first port tried; the next 9 are used if it is taken,
#                     so several repositories can each have their own board
#   write: true       lets the Settings tab edit config.yaml and the autonomy
#                     policy. false serves the same page read-only.
#   open: false       true also launches your browser on every session, which
#                     is a tab per session — the URL is printed either way.
board:
  autostart: true
  port: 4173
  write: true
  open: false

# What a model costs, per MILLION tokens. Optional; absent means the spend
# report counts tokens and shows no money, which is the honest default —
# Tyran does not know what you pay. Operator-written from a vendor's price
# list, never inferred, so there is no provenance wrapper here.
#
# All four rates are required on any model you price: a table carrying three
# of them would price the fourth at zero, silently, and cache reads alone
# measure at roughly three quarters of a real session's cost. A model you
# leave out is reported as unpriced rather than as free.
#
# See docs/cost.md. Uncomment and fill in the ids your platform reports —
# `node scripts/cost.mjs --dir .tyran` lists them under "By model".
# pricing:
#   rate_card: 'list-2026-08' # the label that travels with every amount
#   models:
#     some-model-id:
#       input: 15
#       cache_write: 18.75
#       cache_read: 1.5
#       output: 75
